<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - EventHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">EventHub</a>
            <div class="nav-links">
                <a href="events.html">Browse Events</a>
            </div>
        </div>
    </nav>

    <div class="container auth-container">
        <!-- Login Form -->
        <div class="card auth-card" id="login-box">
            <h2>User Login</h2>
            <div id="login-message" class="message-box" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p class="auth-toggle">Don't have an account? <a href="#" id="show-register">Register here</a></p>
        </div>

        <!-- Registration Form -->
        <div class="card auth-card" id="register-box" style="display: none;">
            <h2>Create Account</h2>
            <div id="register-message" class="message-box" style="display: none;"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Choose a password (min 4 chars)">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <p class="auth-toggle">Already registered? <a href="#" id="show-login">Login here</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
